scraping:
  sites:
    leboncoin: true
    seloger: true
    logicimmo: true
  frequency_max_minutes: 60
  headless: true
  timeout_seconds: 30

search:
  locations:
    - city: "Beauvoisin"
      zip_code: "30640"
      radius_km: 15
  types:
    - "maison"
    - "terrain"
  price:
    min: 100000
    max: 1000000
  surface:
    min: 20
  keywords:
    include: []
    exclude:
      - "viager"

export:
  filepath: "output/annonces_immobilieres.xlsx"
  backup_dir: "output/backups"
